
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Absensi Wisuda UNTAG Samarinda</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 500px;
  margin: 20px auto;
  background: white;
  padding: 24px;
  border-radius: 18px;
  box-shadow: 0 4px 18px #0001;
}

h2 {
  text-align: center;
  color: #a40000;
  margin-bottom: 12px;
}

p {
  text-align: center;
  color: #555;
}

#reader {
  width: 100%;
  margin: 20px auto;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 9px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}

.mulai {
  background: #a40000;
  color: white;
}

.berhenti {
  background: #444;
  color: white;
}

.hasil {
  padding: 18px;
  margin-top: 18px;
  border-radius: 10px;
  background: #eee;
  text-align: center;
  white-space: pre-line;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.sukses {
  background: #d1fae5;
  color: #065f46;
}

.gagal {
  background: #fee2e2;
  color: #991b1b;
}

.info {
  font-size: 12px;
  color: #777;
  margin-top: 18px;
}

  /* AREA SCANNER QR CODE */

#reader {
  width: 100%;
  min-height: 280px;
  margin: 20px auto;
  overflow: hidden;
  border-radius: 12px;
  background: #222;
}

#reader video {
  display: block !important;
  width: 100% !important;
  height: auto !important;
  max-height: 400px;
  object-fit: cover;
  border-radius: 10px;
}

#reader canvas {
  max-width: 100%;
}
</style>
</head>

<body>

<div class="container">

  <h2>ABSENSI WISUDA</h2>

  <p>Universitas 17 Agustus 1945 Samarinda</p>

  <div id="reader"></div>

  <button class="mulai" id="btnMulai"
    onclick="mulaiScan()">
    MULAI SCAN QR CODE
  </button>

  <button class="berhenti" id="btnStop"
    onclick="berhentiScan()" hidden>
    BERHENTI SCAN
  </button>

  <div id="hasil" class="hasil">
    Tekan tombol MULAI SCAN untuk mengaktifkan kamera.
  </div>

  <div class="info">
    Sistem Absensi Digital Wisuda UNTAG Samarinda
  </div>

</div>

<script>

// GANTI DENGAN URL WEB APP APPS SCRIPT MILIK ANDA
const API_URL =
  "https://script.google.com/macros/s/AKfycby2WqjXjLIF61w7FtuGLTmHXnGC1e9C42d8szEXrcJEn5bFUGBXWkYFfgDaZ6wzr48Iqg/exec";

let scanner = null;
let scannerAktif = false;
let sedangProses = false;
let requestScript = null;
let requestTimeout = null;


function tampilkan(pesan, status = "") {

  const box = document.getElementById("hasil");

  box.className = "hasil " + status;
  box.innerText = pesan;

}


function mulaiScan() {

  if (scannerAktif) return;

  if (!window.isSecureContext ||
      !navigator.mediaDevices) {

    tampilkan(
      "Browser tidak mendukung akses kamera. " +
      "Pastikan halaman dibuka melalui HTTPS.",
      "gagal"
    );

    return;
  }

  tampilkan("Meminta izin kamera...");

  document.getElementById("btnMulai").disabled = true;

  scanner = new Html5Qrcode("reader");

  scanner.start(
  { facingMode: "environment" },

  {
    fps: 10,
    qrbox: {
      width: 230,
      height: 230
    },
    aspectRatio: 1.333333
  },

    scanBerhasil

  ).then(function() {

    scannerAktif = true;

    document.getElementById("btnMulai").hidden = true;
    document.getElementById("btnStop").hidden = false;

    tampilkan(
      "Kamera aktif. Arahkan ke QR Code undangan wisudawan."
    );

  }).catch(function(error) {

    scannerAktif = false;

    document.getElementById("btnMulai").disabled = false;

    tampilkan(
      "Gagal mengaktifkan kamera.\n\n" +
      error +
      "\n\nPeriksa izin kamera Chrome dan coba kembali.",
      "gagal"
    );

  });

}


function scanBerhasil(teks) {

  if (sedangProses) return;

  sedangProses = true;

  scanner.pause(true);

  tampilkan("Memeriksa identitas peserta...");

  kirimKeServer(teks.trim());

}


function kirimKeServer(token) {

  if (requestScript) {
    requestScript.remove();
  }

  clearTimeout(requestTimeout);

  const callbackName = "absensiCallback";

  window[callbackName] = function(data) {

    clearTimeout(requestTimeout);

    if (requestScript) {
      requestScript.remove();
      requestScript = null;
    }

    delete window[callbackName];

    tampilkanHasil(data);

  };

  const separator = API_URL.includes("?") ? "&" : "?";

  const url =
    API_URL +
    separator +
    "action=scan" +
    "&token=" + encodeURIComponent(token) +
    "&callback=" + callbackName +
    "&t=" + Date.now();

  requestScript = document.createElement("script");

  requestScript.src = url;

  requestScript.onerror = function() {

    bersihkanRequest();

    tampilkan(
      "Koneksi ke server gagal. Periksa internet dan coba kembali.",
      "gagal"
    );

    lanjutScan(3000);

  };

  document.body.appendChild(requestScript);

  requestTimeout = setTimeout(function() {

    bersihkanRequest();

    tampilkan(
      "Server tidak merespons. Silakan coba kembali.",
      "gagal"
    );

    lanjutScan(3000);

  }, 20000);

}


function bersihkanRequest() {

  clearTimeout(requestTimeout);

  if (requestScript) {
    requestScript.remove();
    requestScript = null;
  }

  delete window.absensiCallback;

}


function tampilkanHasil(data) {

  if (data.sukses) {

    tampilkan(
      "✓ BERHASIL HADIR\n\n" +
      "Nama: " + data.nama +
      "\nNIM: " + data.nim +
      "\nFakultas: " + data.fakultas +
      "\nWaktu: " + data.waktu,
      "sukses"
    );

  } else if (data.duplikat) {

    tampilkan(
      "⚠ SUDAH ABSENSI\n\n" +
      "Nama: " + data.nama +
      "\nNIM: " + data.nim +
      "\nPeserta telah tercatat hadir sebelumnya.",
      "gagal"
    );

  } else {

    tampilkan(
      "✕ ABSENSI GAGAL\n\n" + data.pesan,
      "gagal"
    );

  }

  lanjutScan(2500);

}


function lanjutScan(durasi) {

  setTimeout(function() {

    sedangProses = false;

    if (scannerAktif && scanner) {

      scanner.resume();

      tampilkan(
        "Silakan scan QR Code wisudawan berikutnya."
      );

    }

  }, durasi);

}


function berhentiScan() {

  if (!scanner || !scannerAktif) return;

  scanner.stop().then(function() {

    scannerAktif = false;

    scanner.clear();

    document.getElementById("reader").innerHTML = "";

    document.getElementById("btnMulai").hidden = false;
    document.getElementById("btnMulai").disabled = false;

    document.getElementById("btnStop").hidden = true;

    tampilkan(
      "Kamera dihentikan. Tekan MULAI SCAN untuk memulai kembali."
    );

  }).catch(function(error) {

    tampilkan("Gagal menghentikan kamera: " + error, "gagal");

  });

}

</script>

</body>
</html>
